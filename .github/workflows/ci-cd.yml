name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/flask-api/requirements.txt

      - name: Smoke import Flask app
        run: |
          python -c "import sys; sys.path.append('app/flask-api'); import app as flask_app; print(flask_app.app.url_map)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Flask image
        uses: docker/build-push-action@v6
        with:
          context: app/flask-api
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-api:latest

      - name: Build Nginx image
        uses: docker/build-push-action@v6
        with:
          context: app/nginx
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-proxy:latest

      - name: Push Flask image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: app/flask-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-api:${{ github.sha }}

      - name: Push Nginx image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: app/nginx
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-proxy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-proxy:${{ github.sha }}
